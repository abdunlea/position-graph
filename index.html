<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Motion Simulator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>🎯 Physics Motion Simulator</h1>
    
    <div class="container">
        <div class="grid-container">
            <!-- Top Left: Y Position (horizontal) -->
            <div class="canvas-wrapper">
                <canvas id="yCanvas" width="400" height="400"></canvas>
            </div>
            
            <!-- Top Right: XY Position Grid -->
            <div class="canvas-wrapper">
                <canvas id="xyCanvas" width="400" height="400"></canvas>
                <div class="canvas-label">XY Position</div>
            </div>
            
            <!-- Bottom Left: Time Graph (toggleable) -->
            <div class="canvas-wrapper">
                <div class="graph-buttons">
                    <button class="graph-btn active-time" id="btnYT">y(t)</button>
                    <button class="graph-btn" id="btnXT">x(t)</button>
                    <button class="graph-btn" id="btnTX">t(x)</button>
                </div>
                <canvas id="timeCanvas" width="400" height="400"></canvas>
            </div>
            
            <!-- Bottom Right: X Position (horizontal) -->
            <div class="canvas-wrapper">
                <canvas id="xCanvas" width="400" height="400"></canvas>
            </div>
        </div>
        
        <div class="controls-bar">
            <button id="resetBtn">Reset</button>
            <button id="clearTrailBtn">Clear Trail</button>
            
            <div class="info">
                <div class="info-row">
                    <span class="info-label">Position:</span>
                    <span id="posInfo">x: 5.0m, y: 5.0m</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Velocity:</span>
                    <span id="velInfo">vx: 0.0m/s, vy: 0.0m/s</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Speed:</span>
                    <span id="speedInfo">0.0 m/s</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Time:</span>
                    <span id="timeInfo">0.0 s</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/physics.js"></script>
    <script src="js/graphics.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
